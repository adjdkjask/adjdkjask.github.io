<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR CORTEGE — AI Music Crew</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0b0b0b; 
            color: #f5f5f5; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            border: 1px solid #333;
            padding: 40px;
            background: #111;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        h1 { 
            font-size: 2.5rem; 
            letter-spacing: 4px; 
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        p { 
            font-size: 1rem; 
            line-height: 1.6;
            color: #999;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid #fff;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NOIR CORTEGE</h1>
        <p>AI music crew. Straight from St. Petersburg.<br>Well-mannered, but uneducated.</p>
        <a href="#" class="btn">Listen Tracks</a>
    </div>

</body>
</html>
