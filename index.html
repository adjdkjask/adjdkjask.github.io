<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR CORTEGE — AI Music Crew</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0b0b; 
            color: #f5f5f5; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Полноэкранная шапка-баннер на самом верху */
         .full-width-banner {
            width: 100%;
            height: 55vh; /* Увеличили высоту, чтобы влезло больше картинки */
            background-image: url('media/img/banner.jpg'); 
            background-size: cover;
            background-position: top center; /* Начинаем показ строго с верха картинки */
            border-bottom: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Общий контейнер для нижней части (карточка + видео по бокам) */
        .content-wrapper {
            max-width: 550px;
            width: 100%;
            position: relative;
            margin-top: 40px; /* Отступ карточки от баннера сверху */
            padding: 0 20px 40px 20px;
        }

        /* Центральная карточка с информацией */
        .container {
            width: 100%;
            border: 1px solid #222;
            padding: 40px 30px;
            background: rgba(17, 17, 17, 0.95);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-radius: 4px;
            position: relative;
            z-index: 10;
        }
        h1 { 
            font-size: 2.3rem; 
            letter-spacing: 5px; 
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .subtitle { 
            font-size: 0.95rem; 
            line-height: 1.6;
            color: #777;
            margin-bottom: 35px;
        }
        
        /* Кнопки соцсетей */
        .links-title {
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 130px;
            padding: 10px 15px;
            border: 1px solid #333;
            color: #aaa;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        .social-btn:hover {
            border-color: #fff;
            color: #fff;
            background: #1a1a1a;
        }

            /* Видео по бокам */
        .video-background {
            position: fixed;
            top: calc(55vh + 40px); /* Изменили 45vh на 55vh, чтобы выровнять с карточкой */
            width: 315px;
            height: 560px;
            z-index: 1;
            pointer-events: none;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            opacity: 0.4;
            transition: opacity 0.3s ease;
        }
        .video-background:hover {
            opacity: 0.7;
        }
        .video-left { left: 5%; }
        .video-right { right: 5%; }

        .video-background iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Скрываем видео на мобильных устройствах */
        @media (max-width: 1200px) {
            .video-background {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Полноэкранный баннер на всю ширину -->
    <div class="full-width-banner"></div>

    <!-- Левое видео (вместо bssmGzicB48 вставьте свой ID из YouTube Shorts) -->
    <div class="video-background video-left">
        <iframe src="https://youtube.com" allow="autoplay"></iframe>
    </div>

    <!-- 2. Нижняя центральная часть сайта под баннером -->
    <div class="content-wrapper">
        <div class="container">
            <h1>NOIR CORTEGE</h1>
            <p class="subtitle">AI music crew. Straight from St. Petersburg.<br>Well-mannered, but uneducated.</p>

            <div class="links-title">Listen & Follow</div>
            <div class="social-links">
                <a href="#" target="_blank" class="social-btn"><i class="fa-solid fa-music"></i> Yandex</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-spotify"></i> Spotify</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-youtube"></i> YouTube</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-tiktok"></i> Tik-Tok</a>
            </div>
        </div>
    </div>

    <!-- Правое видео (вместо bssmGzicB48 вставьте тот же ID из YouTube Shorts) -->
    <div class="video-background video-right">
        <iframe src="https://youtube.com" allow="autoplay"></iframe>
    </div>

</body>
</html>
